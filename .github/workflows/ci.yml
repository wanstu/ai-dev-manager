name: CI

on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-source-check:
    name: Pipeline metadata and release source gate
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.pipeline_meta.outputs.build_version }}
      source_run_id: ${{ steps.verify_candidate.outputs.source_run_id }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve build version
        id: pipeline_meta
        shell: bash
        run: |
          set -euo pipefail
          build_version='dev'
          if [[ "$GITHUB_REF" == 'refs/heads/master' ]]; then
            build_version="$(tr -d '\r\n' < .github/release-candidate-version)"
            if [[ ! "$build_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "Invalid release candidate version: $build_version" >&2
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$build_version" >/dev/null; then
              tagged_commit="$(git rev-list -n 1 "$build_version")"
              if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
                echo "Release candidate $build_version is already tagged at $tagged_commit. Bump .github/release-candidate-version before the next master build." >&2
                exit 1
              fi
              echo "Release candidate $build_version already tags this exact commit; allowing a reproducibility rerun."
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            build_version="$GITHUB_REF_NAME"
          fi
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "Build version: $build_version"

      - name: Write master release candidate metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-candidate
          jq -n \
            --arg version "${{ steps.pipeline_meta.outputs.build_version }}" \
            --arg commit "$GITHUB_SHA" \
            '{version:$version, commit:$commit}' > .release-candidate/metadata.json
          cat .release-candidate/metadata.json

      - name: Upload master release candidate metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-metadata
          path: .release-candidate/metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify tag commit is contained in master
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Find successful master candidate run
        id: master_run
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=master \
            -f event=push \
            -f status=success \
            -f head_sha="$GITHUB_SHA" \
            -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "Tag $GITHUB_REF_NAME points to $GITHUB_SHA, but that commit has no successful master CI push run." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Verified master CI run: $run_id"

      - name: Download master release candidate metadata
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-metadata
          path: .release-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.master_run.outputs.run_id }}

      - name: Verify promoted candidate version
        id: verify_candidate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          candidate_version="$(jq -r '.version' .release-candidate/metadata.json)"
          candidate_commit="$(jq -r '.commit' .release-candidate/metadata.json)"
          if [[ "$candidate_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME cannot promote master candidate $candidate_version. Update .github/release-candidate-version and obtain a green master CI first." >&2
            exit 1
          fi
          if [[ "$candidate_commit" != "$GITHUB_SHA" ]]; then
            echo "Candidate commit $candidate_commit does not match tag commit $GITHUB_SHA." >&2
            exit 1
          fi
          echo "source_run_id=${{ steps.master_run.outputs.run_id }}" >> "$GITHUB_OUTPUT"
          echo "Promoting $candidate_version from master run ${{ steps.master_run.outputs.run_id }}"

  windows-test-vet-build:
    name: Windows CI and Desktop artifact
    needs: release-source-check
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Prepare Windows AppContainer host
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          go run ./cmd/adm-sandbox-host-prep prepare-null-device
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./cmd/adm-sandbox-host-prep verify-null-device
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        # Temporary PR diagnostic: force a bounded verbose Windows test run so
        # an AppContainer hang yields the exact test name and goroutine stack.
        run: go test -v -timeout 2m -count=1 ./...

      - name: Vet
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: go vet ./...

      - name: Browser acceptance for Windows Desktop updater
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $env:ADM_UI_SMOKE_FOCUS = 'updater'
          node tests/desktop-ui/browser-smoke.cjs
          $env:ADM_UI_SMOKE_FOCUS = 'updater-web'
          node tests/desktop-ui/browser-smoke.cjs

      - name: Build Windows Desktop artifact
        id: windows_desktop
        shell: pwsh
        run: |
          $buildVersion = '${{ needs.release-source-check.outputs.build_version }}'
          $versionSuffix = if ($buildVersion -eq 'dev') { '' } else { "-$buildVersion" }
          $desktopName = "adm-desktop$versionSuffix-windows-amd64.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./scripts/build-desktop.ps1 -clean -trimpath -o $desktopName -OutputDir dist -Version $buildVersion
          "desktop_name=$desktopName" >> $env:GITHUB_OUTPUT
          "desktop_artifact=adm-desktop$versionSuffix-windows-amd64" >> $env:GITHUB_OUTPUT

      - name: Test Desktop sandbox host-prep install mode
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $desktop = Join-Path $PWD "dist/${{ steps.windows_desktop.outputs.desktop_name }}"
          & $desktop --sandbox-host-prep-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          schtasks.exe /Query /TN "AI Dev Manager Sandbox Host Prep" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Sandbox host-prep boot task was not registered" }
          $helper = Join-Path $env:ProgramFiles 'AI Dev Manager\adm-sandbox-host-prep.exe'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw "Protected sandbox host-prep helper is missing: $helper" }
          schtasks.exe /Delete /TN "AI Dev Manager Sandbox Host Prep" /F | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not remove sandbox host-prep CI task" }
          Remove-Item -LiteralPath $helper -Force
          $helperDir = Split-Path -Parent $helper
          if (Test-Path -LiteralPath $helperDir -PathType Container) {
            Remove-Item -LiteralPath $helperDir -Force -ErrorAction SilentlyContinue
          }
      - name: Ensure NSIS for Windows Setup
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path -LiteralPath $nsis)) { throw "NSIS compiler not found: $nsis" }

      - name: Package Windows Desktop Setup and Portable ZIP
        shell: pwsh
        run: |
          $buildVersion = '${{ needs.release-source-check.outputs.build_version }}'
          $desktopName = if ($buildVersion -eq 'dev') { 'adm-desktop-windows-amd64.exe' } else { "adm-desktop-$buildVersion-windows-amd64.exe" }
          ./scripts/package-windows.ps1 -InputPath "dist/$desktopName" -OutputDir dist -Version $buildVersion

      - name: Upload Windows Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.windows_desktop.outputs.desktop_artifact }}
          path: |
            dist/${{ steps.windows_desktop.outputs.desktop_name }}
            dist/adm-desktop-*-windows-amd64-setup.exe
            dist/adm-desktop-*-windows-amd64-setup.exe.sha256
            dist/adm-desktop-*-windows-amd64.zip
          if-no-files-found: error
          retention-days: 30

  windows-installer-upgrade-e2e:
    name: Windows real Setup rc.3 to current upgrade and data retention
    needs:
      - release-source-check
      - windows-test-vet-build
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && needs.release-source-check.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.windows-test-vet-build.result == 'success') }}
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download promoted Windows Setup artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: adm-desktop-${{ github.ref_name }}-windows-amd64
          path: dist/current
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-source-check.outputs.source_run_id }}

      - name: Download current-run Windows Setup artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.release-source-check.outputs.build_version == 'dev' && 'adm-desktop-windows-amd64' || format('adm-desktop-{0}-windows-amd64', needs.release-source-check.outputs.build_version) }}
          path: dist/current

      - name: Download published v1.4.0-rc.3 Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/previous | Out-Null
          gh release download v1.4.0-rc.3 --repo wanstu/ai-dev-manager --dir dist/previous --pattern 'adm-desktop-v1.4.0-rc.3-windows-amd64-setup.exe*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Real NSIS install, upgrade, uninstall and data retention
        shell: pwsh
        run: |
          $nextVersion = '${{ needs.release-source-check.outputs.build_version }}'
          & ./.github/scripts/adm-windows-setup-upgrade-e2e.ps1 `
            -PreviousSetup 'dist/previous/adm-desktop-v1.4.0-rc.3-windows-amd64-setup.exe' `
            -NextSetup "dist/current/adm-desktop-$nextVersion-windows-amd64-setup.exe" `
            -PreviousVersion 'v1.4.0-rc.3' -NextVersion $nextVersion

  macos-desktop-build:
    name: macOS Desktop universal build
    needs: release-source-check
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Unix runtime integration
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: go test -count=1 ./internal/runtime

      - name: Build macOS universal Desktop artifact
        id: macos_desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildVersion = '${{ needs.release-source-check.outputs.build_version }}'
          ./scripts/build-macos-desktop.ps1 -Version $buildVersion -OutputDir dist -Platform darwin/universal
          $desktopName = "adm-desktop-$buildVersion-darwin-universal.zip"
          "desktop_name=$desktopName" >> $env:GITHUB_OUTPUT
          "desktop_artifact=adm-desktop-$buildVersion-darwin-universal" >> $env:GITHUB_OUTPUT

      - name: Upload macOS Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.macos_desktop.outputs.desktop_artifact }}
          path: dist/${{ steps.macos_desktop.outputs.desktop_name }}
          if-no-files-found: error
          retention-days: 30

  linux-desktop-build:
    name: Linux Desktop amd64 build
    needs: release-source-check
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux Desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Test Linux runtime and Desktop backend
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: go test -count=1 ./internal/runtime ./internal/desktop

      - name: Build Linux Desktop artifact
        id: linux_desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildVersion = '${{ needs.release-source-check.outputs.build_version }}'
          ./scripts/build-linux-desktop.ps1 -Version $buildVersion -OutputDir dist -Platform linux/amd64 -WebKitTag webkit2_41
          $desktopName = "adm-desktop-$buildVersion-linux-amd64"
          "desktop_name=$desktopName" >> $env:GITHUB_OUTPUT
          "desktop_artifact=adm-desktop-$buildVersion-linux-amd64" >> $env:GITHUB_OUTPUT

      - name: Package Linux Desktop
        shell: bash
        run: |
          build_version='${{ needs.release-source-check.outputs.build_version }}'
          bash ./scripts/package-linux.sh "$build_version" "dist/adm-desktop-$build_version-linux-amd64" dist amd64

      - name: Upload Linux Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.linux_desktop.outputs.desktop_artifact }}
          path: |
            dist/${{ steps.linux_desktop.outputs.desktop_name }}
            dist/adm-*-linux-amd64.deb
            dist/adm-*-linux-amd64.tar.gz
            dist/adm-*-linux-amd64*.sha256
          if-no-files-found: error
          retention-days: 30

  cli-cross-build:
    name: CLI artifact (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs:
      - release-source-check
      - windows-test-vet-build
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            os: ubuntu-latest
            ext: ''
          - name: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ''
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            os: macos-latest
            ext: ''
          - name: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
          - name: windows-amd64
            goos: windows
            goarch: amd64
            os: windows-latest
            ext: '.exe'
          - name: windows-arm64
            os: windows-latest
            goos: windows
            goarch: arm64
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Unix runtime integration
        if: matrix.goos != 'windows' && !startsWith(github.ref, 'refs/tags/v')
        run: go test -count=1 ./internal/runtime

      - name: Build CLI artifact
        id: cli_artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildVersion = '${{ needs.release-source-check.outputs.build_version }}'
          $versionSuffix = if ($buildVersion -eq 'dev') { '' } else { "-$buildVersion" }
          $output = "adm$versionSuffix-${{ matrix.name }}${{ matrix.ext }}"
          $artifact = "adm$versionSuffix-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ldflags = "-X ai-dev-manager-v2/internal/version.Version=$buildVersion"
          $env:GOOS = '${{ matrix.goos }}'
          $env:GOARCH = '${{ matrix.goarch }}'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags $ldflags -o "dist/$output" ./cmd/ai-dev-manager
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "output=$output" >> $env:GITHUB_OUTPUT
          "artifact=$artifact" >> $env:GITHUB_OUTPUT

      - name: Package Linux headless CLI (Debian)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          build_version='${{ needs.release-source-check.outputs.build_version }}'
          suffix=''
          if [[ "$build_version" != 'dev' ]]; then
            suffix="-$build_version"
          fi
          package_version="${build_version#v}"
          if [[ "$build_version" == 'dev' ]]; then
            package_version='0.0.0~dev'
          else
            package_version="${package_version/-rc./~rc.}"
          fi
          go run github.com/wanstu/wails-desktop-kit/cmd/desktopkit@v0.11.4 package linux \
            --input "dist/adm$suffix-${{ matrix.name }}" \
            --dist dist \
            --app-name adm \
            --asset-base "adm-cli-$build_version" \
            --package-name adm-cli \
            --package-version "$package_version" \
            --arch "${{ matrix.goarch }}" \
            --formats deb \
            --description 'AI Dev Manager headless CLI and Gateway (no GTK required)' \
            --maintainer 'AI Dev Manager' \
            --section devel
          deb="dist/adm-cli-$build_version-linux-${{ matrix.goarch }}.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'adm-cli'
          test "$(dpkg-deb -f "$deb" Architecture)" = '${{ matrix.goarch }}'
          dpkg-deb -c "$deb" | grep -qE '\./usr/bin/adm$'
          if dpkg-deb -f "$deb" Depends | grep -Eqi 'gtk|webkit'; then
            echo 'Headless CLI package must not depend on GTK/WebKit' >&2
            exit 1
          fi

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cli_artifact.outputs.artifact }}
          path: |
            dist/${{ steps.cli_artifact.outputs.output }}
            dist/adm-cli-*-linux-*.deb
            dist/adm-cli-*-linux-*.deb.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release-source-check
      - windows-installer-upgrade-e2e
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.release-source-check.result == 'success' && needs.windows-installer-upgrade-e2e.result == 'success' }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download promoted master artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: adm-*
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-source-check.outputs.source_run_id }}

      - name: Verify promoted release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            "adm-desktop-$env:GITHUB_REF_NAME-windows-amd64.exe",
            "adm-desktop-$env:GITHUB_REF_NAME-windows-amd64-setup.exe",
            "adm-desktop-$env:GITHUB_REF_NAME-windows-amd64.zip",
            "adm-desktop-$env:GITHUB_REF_NAME-darwin-universal.zip",
            "adm-desktop-$env:GITHUB_REF_NAME-linux-amd64",
            "adm-$env:GITHUB_REF_NAME-linux-amd64",
            "adm-$env:GITHUB_REF_NAME-linux-arm64",
            "adm-$env:GITHUB_REF_NAME-darwin-amd64",
            "adm-$env:GITHUB_REF_NAME-darwin-arm64",
            "adm-$env:GITHUB_REF_NAME-windows-amd64.exe",
            "adm-$env:GITHUB_REF_NAME-windows-arm64.exe"
          )
          foreach ($name in $required) {
            $path = Join-Path 'dist' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Promoted release artifact is missing: $name"
            }
            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Promoted release artifact is empty: $name"
            }
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location dist
          $checksumFile = "SHA256SUMS-$env:GITHUB_REF_NAME.txt"
          if (Test-Path $checksumFile) { Remove-Item -Force $checksumFile }
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -Path $checksumFile
          }
          Get-Content $checksumFile

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ADM ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
