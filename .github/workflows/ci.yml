name: CI

on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test-vet-build:
    name: Windows test, vet, and adm-desktop smoke build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build Windows Desktop artifact
        id: windows_desktop
        shell: pwsh
        run: |
          $tagSuffix = ''
          $buildVersion = 'dev'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagSuffix = "-$env:GITHUB_REF_NAME"
            $buildVersion = $env:GITHUB_REF_NAME
          }
          $desktopName = "adm-desktop$tagSuffix-windows-amd64.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./scripts/build-desktop.ps1 -clean -trimpath -o $desktopName -OutputDir dist -Version $buildVersion
          "desktop_name=$desktopName" >> $env:GITHUB_OUTPUT
          "desktop_artifact=adm-desktop$tagSuffix-windows-amd64" >> $env:GITHUB_OUTPUT

      - name: Ensure NSIS for Windows Setup
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path -LiteralPath $nsis)) { throw "NSIS compiler not found: $nsis" }

      - name: Package Windows Desktop Setup and Portable ZIP
        shell: pwsh
        run: |
          $buildVersion = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'dev' }
          $desktopName = 'adm-desktop-windows-amd64.exe'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $desktopName = "adm-desktop-$buildVersion-windows-amd64.exe" }
          ./scripts/package-windows.ps1 -InputPath "dist/$desktopName" -OutputDir dist -Version $buildVersion

      - name: Upload Windows Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.windows_desktop.outputs.desktop_artifact }}
          path: |
            dist/${{ steps.windows_desktop.outputs.desktop_name }}
            dist/adm-desktop-*-windows-amd64-setup.exe
            dist/adm-desktop-*-windows-amd64-setup.exe.sha256
            dist/adm-desktop-*-windows-amd64.zip
          if-no-files-found: error
          retention-days: 14

  macos-desktop-build:
    name: macOS Desktop universal build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Unix runtime integration
        run: go test -count=1 ./internal/runtime

      - name: Build macOS universal Desktop artifact
        id: macos_desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildVersion = 'dev'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $buildVersion = $env:GITHUB_REF_NAME
          }
          ./scripts/build-macos-desktop.ps1 -Version $buildVersion -OutputDir dist -Platform darwin/universal
          $desktopName = "adm-desktop-$buildVersion-darwin-universal.zip"
          "desktop_name=$desktopName" >> $env:GITHUB_OUTPUT
          "desktop_artifact=adm-desktop-$buildVersion-darwin-universal" >> $env:GITHUB_OUTPUT

      - name: Upload macOS Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.macos_desktop.outputs.desktop_artifact }}
          path: dist/${{ steps.macos_desktop.outputs.desktop_name }}
          if-no-files-found: error
          retention-days: 14

  linux-desktop-build:
    name: Linux Desktop amd64 build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux Desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Test Linux runtime and Desktop backend
        run: go test -count=1 ./internal/runtime ./internal/desktop

      - name: Build Linux Desktop artifact
        id: linux_desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildVersion = 'dev'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $buildVersion = $env:GITHUB_REF_NAME
          }
          ./scripts/build-linux-desktop.ps1 -Version $buildVersion -OutputDir dist -Platform linux/amd64 -WebKitTag webkit2_41
          $desktopName = "adm-desktop-$buildVersion-linux-amd64"
          "desktop_name=$desktopName" >> $env:GITHUB_OUTPUT
          "desktop_artifact=adm-desktop-$buildVersion-linux-amd64" >> $env:GITHUB_OUTPUT

      - name: Package Linux Desktop
        shell: bash
        run: |
          build_version="dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            build_version="$GITHUB_REF_NAME"
          fi
          bash ./scripts/package-linux.sh "$build_version" "dist/adm-desktop-$build_version-linux-amd64" dist amd64

      - name: Upload Linux Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.linux_desktop.outputs.desktop_artifact }}
          path: |
            dist/${{ steps.linux_desktop.outputs.desktop_name }}
            dist/adm-*-linux-amd64.deb
            dist/adm-*-linux-amd64.tar.gz
            dist/adm-*-linux-amd64*.sha256
          if-no-files-found: error
          retention-days: 14

  cli-cross-build:
    name: CLI artifact (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: windows-test-vet-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            os: ubuntu-latest
            ext: ''
          - name: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ''
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            os: macos-latest
            ext: ''
          - name: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
          - name: windows-amd64
            goos: windows
            goarch: amd64
            os: windows-latest
            ext: '.exe'
          - name: windows-arm64
            os: windows-latest
            goos: windows
            goarch: arm64
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Unix runtime integration
        if: matrix.goos != 'windows'
        run: go test -count=1 ./internal/runtime

      - name: Build CLI artifact
        id: cli_artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tagSuffix = ''
          $buildVersion = 'dev'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagSuffix = "-$env:GITHUB_REF_NAME"
            $buildVersion = $env:GITHUB_REF_NAME
          }
          $output = "adm$tagSuffix-${{ matrix.name }}${{ matrix.ext }}"
          $artifact = "adm$tagSuffix-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ldflags = "-X ai-dev-manager-v2/internal/version.Version=$buildVersion"
          $env:GOOS = '${{ matrix.goos }}'
          $env:GOARCH = '${{ matrix.goarch }}'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags $ldflags -o "dist/$output" ./cmd/ai-dev-manager
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "output=$output" >> $env:GITHUB_OUTPUT
          "artifact=$artifact" >> $env:GITHUB_OUTPUT

      - name: Package Linux headless CLI (Debian)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          build_version='dev'
          suffix=''
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            build_version="$GITHUB_REF_NAME"
            suffix="-$build_version"
          fi
          package_version="${build_version#v}"
          if [[ "$build_version" == 'dev' ]]; then
            package_version='0.0.0~dev'
          else
            package_version="${package_version/-rc./~rc.}"
          fi
          go run github.com/wanstu/wails-desktop-kit/cmd/desktopkit@v0.11.3 package linux \
            --input "dist/adm$suffix-${{ matrix.name }}" \
            --dist dist \
            --app-name adm \
            --asset-base "adm-cli-$build_version" \
            --package-name adm-cli \
            --package-version "$package_version" \
            --arch "${{ matrix.goarch }}" \
            --formats deb \
            --description 'AI Dev Manager headless CLI and Gateway (no GTK required)' \
            --maintainer 'AI Dev Manager' \
            --section devel
          deb="dist/adm-cli-$build_version-linux-${{ matrix.goarch }}.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'adm-cli'
          test "$(dpkg-deb -f "$deb" Architecture)" = '${{ matrix.goarch }}'
          dpkg-deb -c "$deb" | grep -qE '\./usr/bin/adm$'
          if dpkg-deb -f "$deb" Depends | grep -Eqi 'gtk|webkit'; then
            echo 'Headless CLI package must not depend on GTK/WebKit' >&2
            exit 1
          fi

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cli_artifact.outputs.artifact }}
          path: |
            dist/${{ steps.cli_artifact.outputs.output }}
            dist/adm-cli-*-linux-*.deb
            dist/adm-cli-*-linux-*.deb.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows-test-vet-build
      - macos-desktop-build
      - linux-desktop-build
      - cli-cross-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location dist
          $checksumFile = "SHA256SUMS-$env:GITHUB_REF_NAME.txt"
          if (Test-Path $checksumFile) { Remove-Item -Force $checksumFile }
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -Path $checksumFile
          }
          Get-Content $checksumFile

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ADM ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
